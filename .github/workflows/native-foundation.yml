name: A2 iOS foundation

on:
  push:
    branches:
      - native/ios-capacitor-sqlite
  pull_request:
    branches:
      - main
      - native/ios-capacitor-sqlite

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test backup compatibility
        run: npm test
      - name: Build web assets for Capacitor
        run: npm run build
