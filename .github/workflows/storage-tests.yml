name: A2 storage tests
on:
  push:
    branches: [dev/a2-gestao-consolidada]
    paths:
      - 'storage/**'
      - 'tests/**'
      - '.github/workflows/storage-tests.yml'
  pull_request:
    paths:
      - 'storage/**'
      - 'tests/**'
      - '.github/workflows/storage-tests.yml'
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests --ignore-scripts
      - run: node --test tests/storage.test.cjs
